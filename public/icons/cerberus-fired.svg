<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Cerberus</title>
  <desc id="desc">A curious three-headed black guardian in front of a yellow, orange and red flame on a white rounded tile.</desc>
  <style>
    .cerberus-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: fire-flicker 1200ms cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    @keyframes fire-flicker {
      0%, 100% { transform: scaleX(1) scaleY(.88) skewX(-2deg); }
      25% { transform: scaleX(.96) scaleY(1.03) skewX(2deg); }
      50% { transform: scaleX(1.025) scaleY(.93) skewX(-1deg); }
      75% { transform: scaleX(.98) scaleY(1.02) skewX(1.5deg); }
    }
    @media (prefers-reduced-motion: reduce) { .cerberus-flame { animation: none; } }
  </style>
  <defs>
    <linearGradient id="fire" x1="0" y1="690" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe500"/>
      <stop offset="0.24" stop-color="#ffd000"/>
      <stop offset="0.52" stop-color="#ff7900"/>
      <stop offset="0.76" stop-color="#ff3000"/>
      <stop offset="1" stop-color="#f00000"/>
    </linearGradient>
    <mask id="eyes" maskUnits="userSpaceOnUse" x="190" y="420" width="860" height="340">
      <rect x="190" y="420" width="860" height="340" fill="black"/>
      <g fill="white">
        <ellipse cx="562" cy="508" rx="60" ry="65"/>
        <ellipse cx="696" cy="495" rx="59" ry="64"/>
        <ellipse cx="255" cy="684" rx="45" ry="52"/>
        <ellipse cx="359" cy="674" rx="47" ry="53"/>
        <ellipse cx="882" cy="687" rx="44" ry="54"/>
        <ellipse cx="991" cy="671" rx="44" ry="49"/>
      </g>
      <g fill="black">
        <circle cx="597" cy="479" r="28"/>
        <circle cx="731" cy="467" r="27"/>
        <circle cx="282" cy="659" r="24"/>
        <circle cx="387" cy="647" r="23"/>
        <circle cx="911" cy="658" r="24"/>
        <circle cx="1019" cy="647" r="23"/>
      </g>
    </mask>
  </defs>
  <rect x="14" y="14" width="1226" height="1226" rx="224" fill="#fafafa"/>
  <path class="cerberus-flame" fill="url(#fire)" d="M177 697 C113 606 159 466 239 374 C270 338 307 299 334 281 C347 273 355 280 350 295 C330 348 333 387 380 406 C365 318 425 244 491 211 C564 176 611 139 598 87 C592 65 605 69 620 76 C690 104 734 149 766 208 C803 255 869 310 863 410 C914 374 913 327 903 294 C898 277 907 273 920 280 C1014 332 1082 448 1093 549 C1098 602 1084 652 1064 696 Z"/>
